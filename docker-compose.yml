services:
  postgres:
    image: postgres:16.1
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: stats-db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  stats-server:
    build:
      context: .
      dockerfile: stat-service/stat-server/Dockerfile
    container_name: stats-server
    ports:
      - "9090:9090"
    depends_on:
      - postgres

  swagger:
    image: swaggerapi/swagger-ui:latest
    container_name: swagger-ui
    ports:
      - "9091:8080"
    environment:
      API_URL: http://localhost:9090/v3/api-docs

volumes:
  pgdata:


